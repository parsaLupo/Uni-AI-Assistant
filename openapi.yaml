          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
    WeekdayEnum:
      enum:
      - 5
      - 0
      - 1
      - 2
      - 3
      - 4
      - 6
      type: integer
      description: |-
        * `5` - شنبه
        * `0` - یکشنبه
        * `1` - دوشنبه
        * `2` - سه‌شنبه
        * `3` - چهارشنبه
        * `4` - پنجشنبه
        * `6` - جمعه
