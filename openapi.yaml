          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        academic_title:
          type: string
          maxLength: 64
      required:
      - first_name
      - full_name
      - id
      - last_name
    Register:
