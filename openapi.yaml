        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 16
      required:
      - code
      - id
      - name
    StudentProfile:
      type: object
      description: |-
        ModelSerializer with generated UniqueValidators removed (→ 409 path).

        `docs/api/admin.md` requires uniqueness conflicts to return
        `409 CONFLICT`, but ModelSerializer injects `UniqueValidator`, which
        field-level errors or machine-readable metadata (the Phase 03 duplicate-email
        bug — accounts silenced it per field; Phase 04 generalizes). The database
        constraint becomes the single source of truth; views convert its
        `IntegrityError` with `common.mixins.ConflictOnIntegrityMixin`. Composite
        uniques bring a `UniqueTogetherValidator`, which additionally breaks PATCH
        (it demands every key field on partial updates) — stripped for the same
        reason.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        student_number:
          type: string
          nullable: true
          maxLength: 16
        department:
          allOf:
          - $ref: '#/components/schemas/StudentDepartment'
          readOnly: true
        department_id:
          type: integer
          writeOnly: true
          nullable: true
        faculty:
          allOf:
          - $ref: '#/components/schemas/Faculty'
          readOnly: true
        faculty_id:
          type: integer
          writeOnly: true
          nullable: true
        degree_level:
          oneOf:
          - $ref: '#/components/schemas/DegreeLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        entry_year:
          type: string
          maxLength: 9
        current_term_number:
          type: integer
          readOnly: true
          nullable: true
        current_gpa:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        onboarding_complete:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_gpa
      - current_term_number
      - department
      - faculty
      - id
      - onboarding_complete
      - updated_at
      - user
    StudentProfileBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
