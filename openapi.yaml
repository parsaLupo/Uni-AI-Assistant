        office:
          type: string
          maxLength: 100
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        bio:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - department_id
      - first_name
      - id
      - last_name
      - updated_at
    ProfessorBrief:
      type: object
      description: Compact professor used nested inside offerings/exams.
      properties:
