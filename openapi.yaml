openapi: 3.0.3
info:
  title: University Smart Assistant API
  version: 1.0.0
  description: 'Versioned REST API under /api/v1/. Errors always use the envelope
    from docs/04-api-specification.md section 3; codes are listed in docs/12-error-handling-observability.md.
    Generated source of truth: ADR-012.'
paths:
  /api/v1/admin/analytics/audit-log/:
    get:
      operationId: api_v1_admin_analytics_audit_log_list
      description: Read-only audit-log viewer over the append-only source (no writes).
      summary: مشاهده‌گر گزارش حسابرسی (فقط خواندنی)
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: entity_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
