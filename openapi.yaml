        `IntegrityError` with `common.mixins.ConflictOnIntegrityMixin`. Composite
        uniques bring a `UniqueTogetherValidator`, which additionally breaks PATCH
        (it demands every key field on partial updates) — stripped for the same
        reason.
      properties:
        id:
          type: integer
          readOnly: true
        department:
          allOf:
          - $ref: '#/components/schemas/Department'
          readOnly: true
        department_id:
          type: integer
          writeOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        academic_title:
          type: string
          maxLength: 64
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        office:
          type: string
          maxLength: 100
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        bio:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - department_id
      - first_name
      - id
      - last_name
      - updated_at
    ProfessorBrief:
