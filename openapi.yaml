          type: string
          format: email
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
    SemesterTypeEnum:
      enum:
      - FIRST
      - SECOND
      - SUMMER
      type: string
      description: |-
        * `FIRST` - نیمسال اول
        * `SECOND` - نیمسال دوم
        * `SUMMER` - نیمسال تابستان
    StudentDepartment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 16
      required:
      - code
      - id
      - name
    StudentProfile:
      type: object
      description: |-
        ModelSerializer with generated UniqueValidators removed (→ 409 path).

        `docs/api/admin.md` requires uniqueness conflicts to return
        `409 CONFLICT`, but ModelSerializer injects `UniqueValidator`, which
        field-level errors or machine-readable metadata (the Phase 03 duplicate-email
        bug — accounts silenced it per field; Phase 04 generalizes). The database
        constraint becomes the single source of truth; views convert its
        `IntegrityError` with `common.mixins.ConflictOnIntegrityMixin`. Composite
        uniques bring a `UniqueTogetherValidator`, which additionally breaks PATCH
        (it demands every key field on partial updates) — stripped for the same
        reason.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        student_number:
          type: string
          nullable: true
          maxLength: 16
        department:
          allOf:
          - $ref: '#/components/schemas/StudentDepartment'
          readOnly: true
        department_id:
          type: integer
          writeOnly: true
          nullable: true
        faculty:
          allOf:
          - $ref: '#/components/schemas/Faculty'
          readOnly: true
        faculty_id:
          type: integer
          writeOnly: true
          nullable: true
        degree_level:
          oneOf:
          - $ref: '#/components/schemas/DegreeLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        entry_year:
          type: string
          maxLength: 9
        current_term_number:
          type: integer
          readOnly: true
          nullable: true
        current_gpa:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        onboarding_complete:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_gpa
      - current_term_number
      - department
      - faculty
      - id
      - onboarding_complete
      - updated_at
      - user
    StudentProfileBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        student_number:
          type: string
          nullable: true
          maxLength: 16
      required:
      - id
      - user
    TypeEnum:
      enum:
      - ANNOUNCEMENT
      - DEADLINE
      - EXAM
      - SYSTEM
      type: string
      description: |-
        * `ANNOUNCEMENT` - اطلاعیه
        * `DEADLINE` - مهلت
        * `EXAM` - امتحان
        * `SYSTEM` - سیستمی
    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
      required:
      - unread_count
    UserBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
    WeekdayEnum:
      enum:
      - 5
      - 0
      - 1
      - 2
      - 3
      - 4
      - 6
      type: integer
      description: |-
        * `5` - شنبه
        * `0` - یکشنبه
        * `1` - دوشنبه
        * `2` - سه‌شنبه
        * `3` - چهارشنبه
        * `4` - پنجشنبه
        * `6` - جمعه
  securitySchemes:
