[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps", "config"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, UP: modern py313 syntax,
# C4: comprehensions, B: bugbear-style mistakes.
select = ["E", "F", "W", "I", "UP", "C4", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Django's migration generator writes long deconstruction lines; re-wrapping them
# by hand risks diverging from what `makemigrations` would emit.
"**/migrations/*.py" = ["E501"]
