openapi: 3.0.3
info:
  title: University Smart Assistant API
  version: 1.0.0
  description: 'Versioned REST API under /api/v1/. Errors always use the envelope
    from docs/04-api-specification.md section 3; codes are listed in docs/12-error-handling-observability.md.
    Generated source of truth: ADR-012.'
paths:
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: GET/POST /api/v1/admin/users/ — ADMIN+ (docs/api/admin.md).
      parameters:
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMeList'
          description: ''
    post:
      operationId: admin_users_create
      description: GET/POST /api/v1/admin/users/ — ADMIN+ (docs/api/admin.md).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: GET/PATCH/DELETE /api/v1/admin/users/{id}/ — soft delete = deactivate.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    put:
      operationId: admin_users_update
      description: GET/PATCH/DELETE /api/v1/admin/users/{id}/ — soft delete = deactivate.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserUpdate'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: GET/PATCH/DELETE /api/v1/admin/users/{id}/ — soft delete = deactivate.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: admin_users_destroy
      description: GET/PATCH/DELETE /api/v1/admin/users/{id}/ — soft delete = deactivate.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/v1/auth/login/ — email + password (ADR-014 decision 1).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/v1/auth/logout/ — revoke family + clear cookie, idempotent.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET /api/v1/auth/me/ — who the Bearer token belongs to.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: POST /api/v1/auth/refresh/ — CSRF-protected, rotating (ADR-014).
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: POST /api/v1/auth/register/ — public, always creates role STUDENT.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: '``GET /api/v1/health/`` — unauthenticated liveness + database
        check.'
      summary: Liveness and dependency health
      tags:
      - system
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
components:
  schemas:
    AdminUserCreate:
      type: object
      description: 'Admin-provisioned account (ADR-014 decision 2: privileged roles
        only here).'
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - id
      - password
    AdminUserUpdate:
      type: object
      description: Email is immutable; role changes are guarded in the view (see docs/api/admin.md).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
      required:
      - email
      - id
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable code from docs/12-error-handling-observability.md.
        message:
          type: string
          description: Human-readable, Persian message (ADR-010); never an internal
            detail.
        details:
          type: object
          additionalProperties: {}
          description: Field-level errors or machine-readable metadata.
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    HealthChecks:
      type: object
      properties:
        database:
          type: string
          description: '''ok'' or ''unavailable''.'
        database_latency_ms:
          type: number
          format: double
          nullable: true
        ai_provider:
          type: string
          description: Provider availability; 'not_configured' until the AI phase
            (ADR-006).
      required:
      - ai_provider
      - database
      - database_latency_ms
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        request_id:
          type: string
          description: Correlation id (docs/12 section 4).
        checks:
          $ref: '#/components/schemas/HealthChecks'
      required:
      - checks
      - request_id
      - service
      - status
      - version
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - email
      - id
      - is_active
      - role
    PaginatedMeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Me'
    PatchedAdminUserUpdate:
      type: object
      description: Email is immutable; role changes are guarded in the view (see docs/api/admin.md).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
    RoleEnum:
      enum:
      - STUDENT
      - PROFESSOR
      - ADMIN
      - SUPERADMIN
      type: string
      description: |-
        * `STUDENT` - Student
        * `PROFESSOR` - Professor
        * `ADMIN` - Admin
        * `SUPERADMIN` - Superadmin
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
