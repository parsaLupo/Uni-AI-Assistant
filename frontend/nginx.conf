# Nginx for the local release stack (Phase 16).
#
# One local entry point: the built React app is served from /, API calls are
# proxied to the private backend service, and /health/* probes reach Django.
# HTTPS is intentionally not configured: this image is for localhost demos
# (user scope for Phase 16), not a public deployment.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 15m;

    # Compression for text assets; images/fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security headers. They are repeated by no location that uses add_header,
    # so nginx's inheritance rules keep them on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API and health traffic stays on the private Docker network: the backend
    # exposes no host port.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Streaming AI answers (text/event-stream) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Vite emits content-hashed files under /assets: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA fallback: every client-side route (e.g. /selection, /admin/users)
    # returns index.html so a refresh or direct link works. index.html itself
    # is never cached, so a new image is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
