# Local development stack (docs/09-deployment.md section 2 container set).
#
#   docker compose up --build
#   curl http://localhost:8000/api/v1/health/
#
# Copy `.env.example` to `.env` first. The pgvector image is pinned exactly so
# the vector extension is available when the RAG phase needs it, without
# floating to an untested major (ADR-002, ADR-008).

name: university-assistant

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usa_db}
      POSTGRES_USER: ${POSTGRES_USER:-usa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usa_user} -d ${POSTGRES_DB:-usa_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-do-not-use-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      # Persian is the user-facing language (ADR-010); API identifiers stay English.
      DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE:-fa}
      DATABASE_URL: postgresql://${POSTGRES_USER:-usa_user}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-usa_db}
      # Run document-processing tasks inline in dev so no Redis/worker is required.
      CELERY_TASK_ALWAYS_EAGER: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Read-only seed dataset (Phase 04): `manage.py seed` defaults to
      # <repo root>/data, which is outside the backend mount, so it is mapped
      # separately — read-only so dev data can never be edited from inside.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Development serves Vite directly; a static production image is described by
  # docs/09-deployment.md section 1 and built from frontend/Dockerfile later.
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_DEV_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
