# Local release stack (Phase 16).
#
#   cp .env.example .env
#   scripts/init-env.ps1            # or edit .env and replace the placeholders
#   docker compose up -d --build db redis
#   docker compose run --rm backend python manage.py migrate
#   docker compose run --rm backend python manage.py seed_demo   # demo data
#   docker compose up -d
#
# Only `web` publishes a host port (default http://localhost:8080); PostgreSQL,
# Redis, Django and Celery stay on the private Compose network. Persistent data
# lives in named volumes and survives `docker compose down`.
#
# Development keeps the old bind-mount/Vite workflow via:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

name: university-assistant

x-backend-environment: &backend-environment
  # --- deployment mode + Django identity --------------------------------
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local-demo}
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
  DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE:-fa}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # --- database ----------------------------------------------------------
  DATABASE_URL: postgresql://${POSTGRES_USER:-usa_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-usa_db}
  DOCUMENT_STORAGE_ROOT: /app/media
  # --- cookies / transport (local-demo HTTP; explicit, never implicit) ---
  COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE must be set in .env}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:?SECURE_SSL_REDIRECT must be set in .env}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:?SECURE_HSTS_SECONDS must be set in .env}
  # --- auth / limits / retention ----------------------------------------
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-5}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
  RATE_AUTH_IP: ${RATE_AUTH_IP:-10/min}
  RATE_AUTH_REFRESH: ${RATE_AUTH_REFRESH:-30/min}
  RATE_AI_ASK: ${RATE_AI_ASK:-20/min}
  RATE_UPLOAD: ${RATE_UPLOAD:-10/min}
  RETENTION_CONVERSATION_DAYS: ${RETENTION_CONVERSATION_DAYS:-180}
  # --- background processing --------------------------------------------
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
  # --- AI provider -------------------------------------------------------
  AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER must be set in .env}
  AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  # --- demo seed ---------------------------------------------------------
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  # --- server process ----------------------------------------------------
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usa_db}
      POSTGRES_USER: ${POSTGRES_USER:-usa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  backend:
    build: ./backend
    image: university-assistant-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment: *backend-environment
    command: ["gunicorn", "config.wsgi:application", "-c", "docker/gunicorn.conf.py"]
    volumes:
      - media_data:/app/media
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: university-assistant-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment: *backend-environment
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    volumes:
      - media_data:/app/media
      - ./data:/data:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 5 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: university-assistant-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  media_data:
