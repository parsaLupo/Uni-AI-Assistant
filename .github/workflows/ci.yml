# CI gate (BACKLOG EPIC 1, docs/08-testing-strategy.md section 6).
#
# The backend suite runs against a real PostgreSQL + pgvector service so that
# constraints, extensions and (from Phase 08) vector SQL are actually exercised
# (pipeline.md section 6, P-06; closes OA-06). A local `pytest` still defaults
# to SQLite for speed — backend/conftest.py only switches when
# TEST_DATABASE_URL is set.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: usa_db
          POSTGRES_USER: usa_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usa_user -d usa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost
      TEST_DATABASE_URL: postgresql://usa_user:ci_password@localhost:5432/usa_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Verify no uncommitted migrations
        run: python manage.py makemigrations --check --dry-run
      # Phase 14 gate: the migration chain must apply cleanly from an empty
      # database (a fresh deployment), not only against a pre-migrated one.
      - name: Migrate from scratch against the CI service
        run: python manage.py migrate --noinput
      - name: Backend tests against PostgreSQL + pgvector
        run: python -m pytest
      - name: OpenAPI contract — valid and no drift (ADR-012)
        run: |
          python manage.py spectacular --file ../openapi.yaml --validate
          git diff --exit-code -- ../openapi.yaml
      - name: Validate docker compose file
        working-directory: ${{ github.workspace }}
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Phase 14 (docs/08 §3): the seven critical journeys in a real browser
  # against a real backend. The stack mirrors docker-compose: Postgres service
  # + Django (AI_PROVIDER=mock so the assistant journey is deterministic and
  # never touches an external LLM) + Vite dev server via Playwright's webServer.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: usa_db
          POSTGRES_USER: usa_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usa_user -d usa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://usa_user:ci_password@localhost:5432/usa_db
      AI_PROVIDER: mock
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Migrate + seed the academic graph
        run: |
          python manage.py migrate --noinput
          python manage.py seed
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Backend API (serves the journeys' /api traffic)
        run: python manage.py runserver 127.0.0.1:8000 &
        working-directory: backend
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/v1/health/
      - name: Critical journeys (docs/08 §3)
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7


